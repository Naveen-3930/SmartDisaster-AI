<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartDisaster AI — Missing Persons Registry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .brand,
        h1,
        h2 {
            font-family: 'Space Grotesk', sans-serif;
        }

        .st-OPEN {
            background: #2A2E38;
            color: #B8C0CC;
        }

        .st-POTENTIAL_MATCH {
            background: #3A2E10;
            color: #FBBF24;
        }

        .st-REUNITED {
            background: #123425;
            color: #34D399;
        }

        .st-CLOSED {
            background: #1C2028;
            color: #6B7280;
        }

        .tab-active {
            background: #FF5A3C;
            color: #0B0F19;
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen">

    <div class="border-b border-slate-800 p-4 flex items-center justify-between">
        <div class="brand font-bold flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-orange-500"></span> SMARTDISASTER — Missing Persons Registry
        </div>
        <a href="/login.html" class="text-xs text-slate-400 hover:text-orange-500">Staff Login</a>
    </div>

    <div class="max-w-3xl mx-auto p-4 md:p-6">
        <p class="text-slate-400 text-sm mb-5">Report someone missing, report someone you've found, or search existing
            reports. No account needed. Please provide a real contact so staff can reach you if there's a match.</p>

        <div class="flex gap-2 mb-5">
            <button id="tabReport" class="tab-active flex-1 py-2 rounded-lg text-sm font-semibold">Report</button>
            <button id="tabSearch"
                class="flex-1 py-2 rounded-lg text-sm font-semibold bg-slate-800 text-slate-300">Search</button>
        </div>

        <!-- REPORT PANEL -->
        <div id="reportPanel" class="bg-slate-900 border border-slate-800 rounded-xl p-5">
            <div class="flex gap-2 mb-4">
                <label class="flex-1"><input type="radio" name="report_type" value="MISSING" checked
                        class="mr-1.5" />I'm reporting someone missing</label>
                <label class="flex-1"><input type="radio" name="report_type" value="FOUND" class="mr-1.5" />I found
                    someone</label>
            </div>
            <div class="space-y-3 text-sm">
                <div>
                    <label class="text-slate-400 text-xs">Name (if known)</label>
                    <input id="mpName" type="text"
                        class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-slate-400 text-xs">Approx. Age</label>
                        <input id="mpAge" type="number" min="0" max="120"
                            class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
                    </div>
                    <div>
                        <label class="text-slate-400 text-xs">Gender</label>
                        <select id="mpGender"
                            class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm">
                            <option value="">Unknown</option>
                            <option value="MALE">Male</option>
                            <option value="FEMALE">Female</option>
                            <option value="OTHER">Other</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="text-slate-400 text-xs">Description (clothing, appearance, distinguishing
                        marks)</label>
                    <textarea id="mpDescription" rows="3"
                        class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm"></textarea>
                </div>
                <div>
                    <label class="text-slate-400 text-xs">Last Seen / Found Location</label>
                    <input id="mpLocation" type="text"
                        class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
                </div>
                <div>
                    <label class="text-slate-400 text-xs">Photo (optional, helps staff verify a match)</label>
                    <input id="mpPhoto" type="file" accept="image/jpeg,image/png,image/webp"
                        class="w-full mt-1 text-xs" />
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-slate-400 text-xs">Your Name *</label>
                        <input id="mpReporterName" type="text" required
                            class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
                    </div>
                    <div>
                        <label class="text-slate-400 text-xs">Your Phone/Email *</label>
                        <input id="mpReporterContact" type="text" required
                            class="w-full mt-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
                    </div>
                </div>
            </div>
            <p id="mpError" class="text-orange-500 text-sm mt-3 min-h-[18px]"></p>
            <button id="mpSubmit"
                class="w-full mt-2 bg-orange-500 hover:brightness-110 text-slate-950 font-semibold rounded-lg py-2.5">Submit
                Report</button>
        </div>

        <!-- SEARCH PANEL -->
        <div id="searchPanel" class="hidden">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 mb-4">
                <div class="flex flex-wrap gap-2">
                    <select id="searchType" class="bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-xs">
                        <option value="">All reports</option>
                        <option value="MISSING">Missing</option>
                        <option value="FOUND">Found</option>
                    </select>
                    <input id="searchQuery" type="text" placeholder="Search name, description, location…"
                        class="flex-1 min-w-[160px] bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-xs" />
                    <button id="searchBtn"
                        class="bg-orange-500 hover:brightness-110 text-slate-950 font-semibold text-xs px-3 py-1.5 rounded-lg">Search</button>
                </div>
            </div>
            <div id="searchResults" class="space-y-3"></div>
        </div>
    </div>

    <script>
        const tabReport = document.getElementById('tabReport');
        const tabSearch = document.getElementById('tabSearch');
        const reportPanel = document.getElementById('reportPanel');
        const searchPanel = document.getElementById('searchPanel');

        tabReport.addEventListener('click', () => {
            reportPanel.classList.remove('hidden');
            searchPanel.classList.add('hidden');
            tabReport.classList.add('tab-active'); tabReport.classList.remove('bg-slate-800', 'text-slate-300');
            tabSearch.classList.remove('tab-active'); tabSearch.classList.add('bg-slate-800', 'text-slate-300');
        });
        tabSearch.addEventListener('click', () => {
            reportPanel.classList.add('hidden');
            searchPanel.classList.remove('hidden');
            tabSearch.classList.add('tab-active'); tabSearch.classList.remove('bg-slate-800', 'text-slate-300');
            tabReport.classList.remove('tab-active'); tabReport.classList.add('bg-slate-800', 'text-slate-300');
            runSearch();
        });

        document.getElementById('mpSubmit').addEventListener('click', async () => {
            const errorEl = document.getElementById('mpError');
            errorEl.textContent = '';
            const reporterName = document.getElementById('mpReporterName').value.trim();
            const reporterContact = document.getElementById('mpReporterContact').value.trim();
            if (!reporterName || !reporterContact) {
                errorEl.textContent = 'Please provide your name and a phone/email so staff can reach you.';
                return;
            }

            const fd = new FormData();
            fd.append('report_type', document.querySelector('input[name="report_type"]:checked').value);
            fd.append('name', document.getElementById('mpName').value.trim());
            fd.append('approx_age', document.getElementById('mpAge').value);
            fd.append('gender', document.getElementById('mpGender').value);
            fd.append('description', document.getElementById('mpDescription').value.trim());
            fd.append('last_seen_location', document.getElementById('mpLocation').value.trim());
            fd.append('reporter_name', reporterName);
            fd.append('reporter_contact', reporterContact);
            const photoFile = document.getElementById('mpPhoto').files[0];
            if (photoFile) fd.append('photo', photoFile);

            const headers = {};
            const token = localStorage.getItem('sd_token');
            if (token) headers['Authorization'] = 'Bearer ' + token;

            try {
                const res = await fetch('/api/missing-persons', { method: 'POST', headers, body: fd });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Submission failed');
                alert('Report submitted. Thank you — staff will follow up if there is a match.');
                document.querySelectorAll('#reportPanel input[type="text"], #reportPanel input[type="number"], #reportPanel textarea').forEach(el => el.value = '');
                document.getElementById('mpPhoto').value = '';
            } catch (err) {
                errorEl.textContent = err.message;
            }
        });

        async function runSearch() {
            const resultsEl = document.getElementById('searchResults');
            resultsEl.innerHTML = 'Loading…';
            const params = new URLSearchParams();
            const type = document.getElementById('searchType').value;
            const q = document.getElementById('searchQuery').value.trim();
            if (type) params.set('report_type', type);
            if (q) params.set('q', q);

            try {
                const res = await fetch('/api/missing-persons?' + params.toString());
                const data = await res.json();
                if (!data.reports || !data.reports.length) { resultsEl.innerHTML = '<p class="text-slate-500 text-sm">No reports found.</p>'; return; }
                resultsEl.innerHTML = '';
                data.reports.forEach((r) => {
                    const card = document.createElement('div');
                    card.className = 'bg-slate-900 border border-slate-800 rounded-xl p-4 flex gap-3';
                    card.innerHTML = `
        ${r.photo_path ? `<img src="${r.photo_path}" class="w-20 h-20 object-cover rounded-lg flex-shrink-0" />` : `<div class="w-20 h-20 bg-slate-800 rounded-lg flex-shrink-0 flex items-center justify-center text-slate-600 text-xs">No photo</div>`}
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="font-medium">${r.name || 'Name unknown'}</span>
            <span class="text-xs px-2 py-0.5 rounded ${r.report_type === 'MISSING' ? 'bg-orange-900 text-orange-300' : 'bg-sky-900 text-sky-300'}">${r.report_type}</span>
            <span class="text-xs px-2 py-0.5 rounded st-${r.status}">${r.status.replace('_', ' ')}</span>
          </div>
          <div class="text-slate-400 text-xs mt-1">${r.gender || 'Unknown gender'}${r.approx_age ? ', ~' + r.approx_age + ' yrs' : ''}${r.last_seen_location ? ' — ' + r.last_seen_location : ''}</div>
          <div class="text-slate-500 text-xs mt-1">${r.description || ''}</div>
          <div class="text-slate-600 text-xs mt-1">Reported ${new Date(r.created_at).toLocaleString()}</div>
        </div>`;
                    resultsEl.appendChild(card);
                });
            } catch (err) {
                resultsEl.innerHTML = '<p class="text-orange-400 text-sm">Failed to load reports.</p>';
            }
        }

        document.getElementById('searchBtn').addEventListener('click', runSearch);
        document.getElementById('searchQuery').addEventListener('keydown', (e) => { if (e.key === 'Enter') runSearch(); });
    </script>
</body>

</html>

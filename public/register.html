<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SmartDisaster AI — Register</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif;} .brand{font-family:'Space Grotesk',sans-serif;}</style>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center text-slate-100">
  <div class="bg-slate-900 border border-slate-800 rounded-xl p-8 w-full max-w-sm">
    <div class="flex items-center gap-2 mb-1">
      <span class="w-2.5 h-2.5 rounded-full bg-orange-500"></span>
      <span class="brand font-bold text-lg">SMARTDISASTER AI</span>
    </div>
    <p class="text-slate-400 text-sm mb-6">Create your account</p>

    <form id="regForm" class="space-y-4">
      <div>
        <label class="block text-xs uppercase tracking-wide text-slate-400 mb-1">Name</label>
        <input type="text" id="name" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 focus:outline-none focus:border-orange-500" />
      </div>
      <div>
        <label class="block text-xs uppercase tracking-wide text-slate-400 mb-1">Email</label>
        <input type="email" id="email" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 focus:outline-none focus:border-orange-500" />
      </div>
      <div>
        <label class="block text-xs uppercase tracking-wide text-slate-400 mb-1">Phone</label>
        <input type="text" id="phone" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 focus:outline-none focus:border-orange-500" />
      </div>
      <div>
        <label class="block text-xs uppercase tracking-wide text-slate-400 mb-1">Location</label>
        <input type="text" id="location" placeholder="City / Area" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 focus:outline-none focus:border-orange-500" />
      </div>
      <div>
        <label class="block text-xs uppercase tracking-wide text-slate-400 mb-1">Password</label>
        <input type="password" id="password" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 focus:outline-none focus:border-orange-500" />
      </div>
      <p id="error" class="text-orange-500 text-sm min-h-[18px]"></p>
      <button type="submit" class="w-full bg-orange-500 hover:brightness-110 text-slate-950 font-semibold rounded-lg py-2.5">Create Account</button>
    </form>

    <p class="text-slate-400 text-sm text-center mt-5">Already have an account? <a href="/login.html" class="text-sky-400">Login</a></p>
  </div>

<script src="/js/api.js"></script>
<script>
document.getElementById('regForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('error');
  errorEl.textContent = '';
  try {
    await API.request('/api/auth/register', {
      method: 'POST',
      body: {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        location: document.getElementById('location').value,
        password: document.getElementById('password').value,
      },
    });
    window.location.href = '/login.html';
  } catch (err) {
    errorEl.textContent = err.message;
  }
});
</script>
</body>
</html>
